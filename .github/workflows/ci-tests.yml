name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-secrets:
    name: Check GCP Secrets
    runs-on: ubuntu-latest
    outputs:
      has-gcp: ${{ steps.check.outputs.has-gcp }}
    steps:
      - id: check
        run: |
          if [ -n "${{ secrets.WIF_PROVIDER }}" ] && [ -n "${{ secrets.WIF_SERVICE_ACCOUNT }}" ] && [ -n "${{ secrets.GCP_PROJECT_ID }}" ]; then
            echo "has-gcp=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-gcp=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping GCP build/deploy because WIF_PROVIDER, WIF_SERVICE_ACCOUNT, or GCP_PROJECT_ID is not configured."
          fi

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.*"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest tests/ --ignore=tests/test_rxnorm_client.py -v

  build:
    name: Build Image
    runs-on: ubuntu-latest
    needs: check-secrets
    if: needs.check-secrets.outputs.has-gcp == 'true'
    permissions:
      contents: 'read'
      id-token: 'write'
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6

      - name: Compute image tag
        run: |
          TAG="europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/pillchecker-repo/api"
          CLEAN_REF=$(echo "${{ github.ref_name }}" | sed 's/\//-/g')
          echo "IMAGE_TAG=$TAG:${{ github.sha }}" >> "$GITHUB_ENV"
          echo "CACHE_TAG=$TAG:cache-$CLEAN_REF" >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_TAG }}
          build-args: |
            DRUGBANK_DB_REPO=${{ secrets.DRUGBANK_DB_REPO || 'openpharma-org/drugbank-mcp-server' }}
          cache-from: |
            type=registry,ref=${{ env.CACHE_TAG }}
            type=registry,ref=europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/pillchecker-repo/api:cache-main
          cache-to: type=registry,ref=${{ env.CACHE_TAG }},mode=max

  integration-tests:
    name: Integration Smoke Tests
    runs-on: ubuntu-latest
    needs: [check-secrets, build]
    if: always() && (needs.build.result == 'success' || (needs.build.result == 'skipped' && needs.check-secrets.result == 'success'))
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - uses: actions/checkout@v6

      - name: Compute image tag
        run: |
          PROJECT_ID="${{ secrets.GCP_PROJECT_ID || 'missing-project' }}"
          echo "IMAGE_TAG=europe-west1-docker.pkg.dev/$PROJECT_ID/pillchecker-repo/api:${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - name: Authenticate to Google Cloud
        if: needs.check-secrets.outputs.has-gcp == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        if: needs.check-secrets.outputs.has-gcp == 'true'
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev

      - name: Pull or Build image
        run: |
          if [ "${{ needs.build.result }}" == "success" ]; then
            echo "Pulling pre-built image from registry..."
            docker pull ${{ env.IMAGE_TAG }}
            docker tag ${{ env.IMAGE_TAG }} pillchecker-api:ci
          else
            echo "Build job was skipped or secrets missing, building locally..."
            docker build \
              --build-arg DRUGBANK_DB_REPO="${{ secrets.DRUGBANK_DB_REPO || 'openpharma-org/drugbank-mcp-server' }}" \
              -t pillchecker-api:ci .
          fi

      - name: Start API
        run: >
          docker compose
          -f docker-compose.yml
          -f docker-compose.ci.yml
          up -d api

      - name: Wait for API startup
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:8000/health/data | grep -q '"drugbank":"connected"'; then
              echo "API ready!"
              exit 0
            fi
            echo "Waiting for API... ($i/30)"
            sleep 5
          done
          echo "Timeout waiting for API"
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs api
          exit 1

      - name: Run smoke tests
        run: ./scripts/smoke-test.sh http://localhost:8000

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml logs api

      - name: Stop containers
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down

  deploy:
    name: Deploy
    needs: [unit-tests, integration-tests, build, check-secrets]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.check-secrets.outputs.has-gcp == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6

      - name: Compute image tag
        run: echo "IMAGE_TAG=europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/pillchecker-repo/api:${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: pillchecker-api
          image: ${{ env.IMAGE_TAG }}
          region: europe-west1
          env_vars: |
            DRUGBANK_DB_REPO=${{ secrets.DRUGBANK_DB_REPO || 'openpharma-org/drugbank-mcp-server' }}
          secrets: |
            API_KEY=API_KEY:latest
            HF_TOKEN=HF_TOKEN:latest
          flags: |
            --allow-unauthenticated
            --port=8000
            --memory=2Gi
            --cpu=1
            --concurrency=80
            --service-account=${{ secrets.CLOUD_RUN_SERVICE_ACCOUNT || format('deploy-sa@{0}.iam.gserviceaccount.com', secrets.GCP_PROJECT_ID) }}
