name: Sync to Hugging Face Hub
on:
  push:
    branches: [main, gliner-evaluation, feat/jobs]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Sync to Space
        uses: huggingface/hub-sync@v0.1.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: SPerva/pillchecker-staging
          hf_token: ${{ secrets.HF_TOKEN }}
          repo_type: space
          space_sdk: docker
